# The merge gates for a PR into main: the stub ban, the contract freeze, the evidence rule, and the verdict gate (a verdict for the
# named item at the head sha, from a session other than the builder's, whose named tests pass). See docs/gates.md.
name: verdict
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: no stubs under packages/ and plugins/, no history references in the harness source
        run: node scripts/gates/pr-gate.mjs stubs
      - name: contract freeze
        if: ${{ !cancelled() }}
        run: node scripts/gates/pr-gate.mjs freeze
      - name: evidence under verify/ is small and is not a test listing
        if: ${{ !cancelled() }}
        run: node scripts/gates/pr-gate.mjs evidence
      - name: install dependencies, for the tests the verdict names
        if: ${{ !cancelled() }}
        run: npm ci
      - name: verdict at the head sha, from a separate session, its named tests run
        if: ${{ !cancelled() }}
        run: node scripts/gates/pr-gate.mjs verdict
